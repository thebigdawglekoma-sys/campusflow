<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusFlow — Study smarter. Stay organised.</title>
<style>
:root{--p:#5b4bdb;--pd:#4638b8;--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e5e8ef;--soft:#eeecff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between}
.logo{font-size:22px;font-weight:800}.logo span{color:var(--p)}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750}.primary{background:var(--p);color:#fff}.light{background:#f0f1f6;color:var(--text)}
.hero{max-width:1120px;margin:auto;padding:80px 24px}.heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:45px;align-items:center}
.badge{display:inline-block;background:var(--soft);color:var(--p);padding:7px 11px;border-radius:99px;font-size:13px;font-weight:800}
h1{font-size:clamp(42px,6vw,70px);line-height:1.02;letter-spacing:-3px;margin:18px 0}.lead{font-size:18px;line-height:1.7;color:var(--muted)}
.preview,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 35px #14204012}
.previewGrid,.features,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{background:#f8f8fc;border-radius:14px;padding:16px}.mini b{display:block;font-size:26px;margin-top:6px}
.features{grid-template-columns:repeat(3,1fr);max-width:1120px;margin:0 auto;padding:20px 24px 70px}.feature{padding:20px;background:#fff;border:1px solid var(--line);border-radius:16px}.feature p{color:var(--muted);line-height:1.5}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authCard{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px}
label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}.input{width:100%;padding:12px;border:1px solid #d8dce6;border-radius:10px}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px}.side a{display:block;padding:11px 12px;border-radius:10px;margin:4px 0;color:#596173;font-weight:650;text-decoration:none}.side a.active,.side a:hover{background:var(--soft);color:var(--p)}
.main{max-width:1250px;width:100%;padding:28px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:32px;letter-spacing:-1px;margin:0}.stats{grid-template-columns:repeat(4,1fr)}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat b{display:block;font-size:28px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.pill{background:#f0f1f6;border-radius:99px;padding:5px 9px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:25px}
.modal{position:fixed;inset:0;background:#11182788;display:grid;place-items:center;padding:20px}.modalBox{background:#fff;border-radius:18px;padding:24px;width:min(500px,100%)}
@media(max-width:850px){.heroGrid,.grid2{grid-template-columns:1fr}.features{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}
@media(max-width:600px){.features{grid-template-columns:1fr}.hero{padding-top:45px}.top{align-items:flex-start;gap:12px}.previewGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY="campusflow_simple_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{user:null,assignments:[],tests:[],tasks:[],expenses:[],habits:[]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function landing(){root.innerHTML=`<nav class="nav"><div class="logo">Campus<span>Flow</span></div><button class="btn primary" onclick="showAuth()">Get started</button></nav>
<section class="hero"><div class="heroGrid"><div><span class="badge">Built for university students</span><h1>Study smarter. Stay organised. Survive university.</h1><p class="lead">One simple workspace for assignments, tests, grades, planning, habits and student money.</p><button class="btn primary" onclick="showAuth()">Start for free →</button></div><div class="preview"><b>My CampusFlow</b><div class="previewGrid" style="margin-top:16px"><div class="mini">Assignments<b>4</b></div><div class="mini">Tests<b>2</b></div><div class="mini">Study tasks<b>7</b></div><div class="mini">Budget<b>R650</b></div></div></div></div></section>
<div class="features">${feat("📚","Assignments","Track deadlines and tasks.")}${feat("📝","Tests & Exams","Know what is coming.")}${feat("📊","Grade Calculator","Calculate your weighted mark.")}${feat("🗓️","Weekly Planner","Turn busy weeks into actions.")}${feat("💰","Budget","Track student spending.")}${feat("🔥","Habits","Build consistent routines.")}</div>`}
function feat(i,t,p){return `<div class="feature"><div style="font-size:25px">${i}</div><h3>${t}</h3><p>${p}</p></div>`}
function showAuth(login=false){root.innerHTML=`<div class="auth"><div class="authCard"><div class="logo">Campus<span>Flow</span></div><h2>${login?"Welcome back":"Create your account"}</h2><p style="color:var(--muted);font-size:13px">Free prototype — your data is saved in this browser.</p><form onsubmit="auth(event,${login})">${login?"":"<label>Name</label><input class=input id=name required placeholder='Your name'>"}<label>Email</label><input class=input id=email type=email required placeholder="you@example.com"><label>Password</label><input class=input id=pass type=password required minlength=4 placeholder="••••••••"><div id=err style="color:#c93b4b;font-size:13px;margin-top:8px"></div><button class="btn primary" style="width:100%;margin-top:18px">${login?"Log in":"Create account"}</button></form><p style="font-size:13px;color:var(--muted)">${login?"New here?":"Already have an account?"} <a href="#" onclick="event.preventDefault();showAuth(${!login})" style="color:var(--p);font-weight:700">${login?"Create account":"Log in"}</a></p><a href="#" onclick="event.preventDefault();landing()" style="font-size:13px">← Back</a></div></div>`}
function auth(e,login){e.preventDefault();let email=document.getElementById("email").value.trim().toLowerCase(),pass=document.getElementById("pass").value;let k="cf_user_"+email;
if(login){let u=JSON.parse(localStorage.getItem(k)||"null");if(!u||u.pass!==pass){err.textContent="No matching account found on this device.";return}S.user=u}else{let name=document.getElementById("name").value.trim();if(localStorage.getItem(k)){err.textContent="That email is already registered on this device.";return}let u={name,email,pass};localStorage.setItem(k,JSON.stringify(u));S.user=u}save();dashboard()}
function nav(p,t){return `<a href="#${p}" class="${(location.hash.slice(1)||"home")===p?"active":""}">${t}</a>`}
function dashboard(){let p=location.hash.slice(1)||"home";root.innerHTML=`<div class="app"><aside class="side"><div class="logo" style="padding:0 10px 16px">Campus<span>Flow</span></div>${nav("home","🏠 Dashboard")}${nav("assignments","📚 Assignments")}${nav("tests","📝 Tests & Exams")}${nav("grades","📊 Grade Calculator")}${nav("planner","🗓️ Weekly Planner")}${nav("budget","💰 Budget")}${nav("habits","🔥 Habits")}<button class="btn light" style="width:100%;margin-top:18px" onclick="logout()">Sign out</button></aside><main class="main">${page(p)}</main></div>`}
function page(p){if(p==="assignments")return listPage("Assignments","assignment");if(p==="tests")return listPage("Tests & Exams","test");if(p==="planner")return planner();if(p==="budget")return budget();if(p==="habits")return habits();if(p==="grades")return grades();return home()}
function home(){let a=S.assignments.filter(x=>!x.done).length,t=S.tests.length,q=S.tasks.filter(x=>!x.done).length,e=S.expenses.reduce((n,x)=>n+Number(x.amount),0);return `<div class=top><div><h1>Good day, ${esc(S.user.name)} 👋</h1><p style="color:var(--muted)">Here’s your CampusFlow overview.</p></div><button class="btn primary" onclick="add('assignment')">+ Assignment</button></div><div class=stats><div class=stat>Open assignments<b>${a}</b></div><div class=stat>Upcoming tests<b>${t}</b></div><div class=stat>Planner tasks<b>${q}</b></div><div class=stat>Tracked spending<b>R${e.toFixed(0)}</b></div></div><div class=grid2><div class=card><h3>Upcoming assignments</h3>${rows(S.assignments.slice(0,5))}</div><div class=card><h3>Upcoming tests</h3>${rows(S.tests.slice(0,5))}</div></div>`}
function rows(arr){return arr.length?arr.map(x=>`<div class=row><div><b>${esc(x.title)}</b><div style="font-size:12px;color:var(--muted)">${esc(x.date||"No date")} ${x.course?"· "+esc(x.course):""}</div></div><span class=pill>${x.done?"Done":"Upcoming"}</span></div>`).join(""):`<div class=empty>Nothing here yet.</div>`}
function listPage(title,type){let a=type==="assignment"?S.assignments:S.tests;return `<div class=top><div><h1>${title}</h1><p style="color:var(--muted)">Keep your academic deadlines in one place.</p></div><button class="btn primary" onclick="add('${type}')">+ Add</button></div><div class=card>${rows(a)}${a.length?`<div style="margin-top:12px">${a.map(x=>`<button class="btn light" style="margin:3px" onclick="del('${type}',${x.id})">Delete ${esc(x.title)}</button>`).join("")}</div>`:""}</div>`}
function planner(){return `<div class=top><div><h1>Weekly Planner</h1><p style="color:var(--muted)">Break the week into manageable actions.</p></div><button class="btn primary" onclick="add('task')">+ Task</button></div><div class=card>${S.tasks.length?S.tasks.map(x=>`<div class=row><label style="margin:0"><input type=checkbox ${x.done?"checked":""} onchange="toggleTask(${x.id})"> ${esc(x.title)}</label><span class=pill>${esc(x.day)}</span></div>`).join(""):"<div class=empty>Add your first task.</div>"}</div>`}
function budget(){let n=S.expenses.reduce((a,x)=>a+Number(x.amount),0);return `<div class=top><div><h1>Student Budget</h1><p style="color:var(--muted)">Track your spending.</p></div><button class="btn primary" onclick="add('expense')">+ Expense</button></div><div class=stats><div class=stat>Tracked spending<b>R${n.toFixed(2)}</b></div></div><div class=card style="margin-top:16px">${S.expenses.length?S.expenses.map(x=>`<div class=row><b>${esc(x.title)}</b><b>R${Number(x.amount).toFixed(2)}</b></div>`).join(""):"<div class=empty>No expenses yet.</div>"}</div>`}
function habits(){return `<div class=top><div><h1>Habits</h1><p style="color:var(--muted)">Consistency beats intensity.</p></div><button class="btn primary" onclick="add('habit')">+ Habit</button></div><div class=features style="padding:0;max-width:none">${S.habits.map(x=>`<div class=feature><h3>${esc(x.title)}</h3><p>${x.streak} day streak</p><button class="btn light" onclick="habit(${x.id})">Mark today</button></div>`).join("")||"<div class=empty>Create your first habit.</div>"}</div>`}
function grades(){return `<div class=top><div><h1>Grade Calculator</h1><p style="color:var(--muted)">Calculate the mark you need on remaining work.</p></div></div><div class=card><label>Current mark (%)</label><input class=input id=gm type=number value=65><label>Weight completed (%)</label><input class=input id=gw type=number value=50><label>Target final mark (%)</label><input class=input id=gt type=number value=75><button class="btn primary" style="margin-top:16px" onclick="calc()">Calculate</button><div class=mini style="margin-top:16px">Required mark on remaining work<b id=res>—</b></div></div>`}
function add(type){let title={assignment:"Add assignment",test:"Add test or exam",task:"Add planner task",expense:"Add expense",habit:"Add habit"}[type];let extra=type==="expense"?`<label>Amount (R)</label><input class=input id=amount type=number step=.01 required>`:type==="task"?`<label>Day</label><select class=input id=day><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select>`:type==="assignment"||type==="test"?`<label>Course</label><input class=input id=course><label>Date</label><input class=input id=date type=date>`:"";root.insertAdjacentHTML("beforeend",`<div class=modal id=modal><div class=modalBox><h2>${title}</h2><form onsubmit="saveItem(event,'${type}')"><label>${type==="expense"?"Expense":"Title"}</label><input class=input id=title required>${extra}<div style="margin-top:18px"><button class="btn primary">Save</button> <button type=button class="btn light" onclick="modal.remove()">Cancel</button></div></form></div></div>`)}
function saveItem(e,type){e.preventDefault();let x={id:Date.now(),title:title.value};if(type==="assignment"||type==="test"){x.course=course.value;x.date=date.value;x.done=false;S[type==="assignment"?"assignments":"tests"].push(x)}else if(type==="task"){x.day=day.value;x.done=false;S.tasks.push(x)}else if(type==="expense"){x.amount=amount.value;S.expenses.push(x)}else{ x.streak=0;S.habits.push(x)}save();modal.remove();dashboard()}
function del(type,id){let a=type==="assignment"?S.assignments:S.tests;let i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);save();dashboard()}
function toggleTask(id){let x=S.tasks.find(x=>x.id===id);x.done=!x.done;save();dashboard()}
function habit(id){let x=S.habits.find(x=>x.id===id);x.streak++;save();dashboard()}
function calc(){let m=+gm.value,w=+gw.value,t=+gt.value;let r=(t-m*w/100)/(1-w/100);res.textContent=isFinite(r)?r.toFixed(2)+"%":"—"}
function logout(){S.user=null;save();landing()}
window.onhashchange=()=>S.user&&dashboard();
landing();
</script>
</body>
</html>
